[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "preparador-dados-ia"
version = "0.1.0"
description = "Converte e particiona arquivos locais para uso em plataformas de IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "charset-normalizer>=3.4,<4",
  "markdown-it-py>=4.2,<5",
  "openpyxl>=3.1,<4",
  "pypdf>=6.14,<7",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "jsonschema",
  "pillow>=12.3,<13",
  "pyinstaller==6.22.2",
  "pytest",
  "reportlab>=4.4,<5",
  "ruff",
]

[project.scripts]
preparador-dados = "preparador_dados_ia.cli:main"
preparador-dados-gui = "preparador_dados_ia.ui.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
preparador_dados_ia = ["assets/*.ico", "assets/*.png"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
