[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "limebh-preparador-ia"
version = "0.1.0"
description = "Preparador local de dados administrativos da LIMEBH para uso com IA."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Coordenação de Tecnologia da LIMEBH" },
]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema",
  "pytest",
  "ruff",
]

[project.scripts]
limebh-preparador = "limebh_preparador.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
